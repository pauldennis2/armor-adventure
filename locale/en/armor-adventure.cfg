[entity-description]
aquilo-elevator-shaft=A specialized excavation machine. Feed it concrete and steel plate to dig toward the ancient Fulgoran depot buried below. Produces stone and iron ore as byproducts — route these away to keep the machine running. 100 segments required.
pheromone-emitter=Emits synthetic biter pheromones that drive the local fauna into a frenzy. Place it and defend it — something powerful is drawn to the resonance. Higher quality emitters may attract something even more formidable.
harvester=Searches for and consumes mind-controlled enemies in a 10 tile radius. Converts their health to Enemy Biomass (1 biomass per 1000 HP), which is then crafted into Gleba Parts. Requires power to operate.
massive-lightning-collector=Draws in lightning strikes from a much wider area, but does not send any electricity to the grid. Where could all that power be going? Best placed far from your base.

