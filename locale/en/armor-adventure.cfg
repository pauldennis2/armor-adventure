[item-description]
pocket-dimension-generator=A modified fusion reactor that also tears a stable rift to your pocket dimension. Without this equipped, the rift cannot be opened or closed.
harvester=Searches for and consumes mind-controlled enemies in a 10 tile radius. Converts their health to Enemy Biomass (1 biomass per 1000 HP), which is then crafted into Pentapod Tissue Samples.
mech-armor-mk2=An upgraded version of the mech suit with a larger grid, enhanced resistances, and unique equipment discoverable from additional planets. Retains the flight capability of the mech armor.
regenerative-plating=An energy shield woven into the Promethium Armor's chassis. Only one may be installed at a time.
personal-combat-roboport=A combat-hardened personal roboport module. Automatically deploys defender drones when enemies are detected nearby. Drones are provided free — no capsules required. Only one may be equipped at a time.\nCooldown: 30s. Spawned drones match equipment quality.\nDrones / Range — Normal: 2/20  •  Uncommon: 3/26  •  Rare: 4/32  •  Epic: 5/38  •  Legendary: 7/50
personal-combat-roboport-distractor=A combat-hardened personal roboport module. Deploys distractor drones (laser) when enemies are detected nearby. Drones are provided free — no capsules required. Only one may be equipped at a time.\nCooldown: 30s. Spawned drones match equipment quality.\nDrones / Range — Normal: 2/20  •  Uncommon: 3/26  •  Rare: 4/32  •  Epic: 5/38  •  Legendary: 7/50
personal-combat-roboport-destroyer=A combat-hardened personal roboport module. Deploys destroyer drones when enemies are detected nearby. Drones are provided free — no capsules required. Only one may be equipped at a time.\nCooldown: 30s. Spawned drones match equipment quality.\nDrones / Range — Normal: 2/20  •  Uncommon: 3/26  •  Rare: 4/32  •  Epic: 5/38  •  Legendary: 7/50
personal-beacon-equipment=A full beacon integrated into the Promethium Armor. Hovers above the player and supplies nearby machines with module effects. Insert modules by right-clicking the floating beacon. Only one may be equipped at a time.
personal-robot-stash=Stores 5 construction bots inside the Promethium Armor. Automatically deploys them when ghosted entities or deconstruction orders are detected nearby. Bots return on their own when work is done.
personal-tesla-turret=A miniaturized tesla turret integrated into the Promethium Armor. Fires every 1s at enemies within 25 tiles; beams slow and push back on hit, then chain up to 5 times. Only one may be equipped at a time.\nPrimary hit — Normal: 25  •  Uncommon: 75  •  Rare: 150  •  Epic: 225  •  Legendary: 400\nChain hit — Normal: 2  •  Uncommon: 5  •  Rare: 15  •  Epic: 25  •  Legendary: 75
quantum-coil=A modular energy coil. Place it on the ground to deploy a laser turret, or slot it into Promethium Armor to use as a personal laser defense module.
personal-warp-pylon-equipment=A miniaturized version of the warp pylon that can be equipped in the Promethium Armor. Also increases movement speed. Only one may be equipped at a time.
personal-time-stopper=A modified battery integrated into the Promethium Armor. Also stores energy as a battery. Press Alt+T to activate a time distortion field: your movement and crafting speed surge while nearby enemies are slowed to a crawl. Only one may be equipped at a time.\nDuration — Normal: 10s  •  Uncommon: 12s  •  Rare: 15s  •  Epic: 20s  •  Legendary: 30s\nCooldown: 60s after effect ends.
armor-forging-station=Used for forging all components for the Promethium Armor as well as the armor itself. Due to the nature of the materials involved, cannot accept quality modules.
massive-lightning-collector=Draws in lightning strikes from a much wider area, but does not send any electricity to the grid. Where could all that power be going? Best placed far from your base.

