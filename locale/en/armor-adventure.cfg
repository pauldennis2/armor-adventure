[tips-and-tricks-item-description]
armor-adventure-welcome=Welcome to Armor Adventure! In order to proceed, first get to promethium science and research the "Armor Forging Station" technology.
armor-adventure-welcome-ready=Welcome to Armor Adventure! You're getting ready to craft your armor.

[technology-description]
castra-simulac-investigation=Analyze the SIMULAC threat on Castra. Unlocks the SIMULAC Data Tap — a device that can intercept the SIMULAC signal and calibrate it to a desired quality. Craft taps and carry them when engaging data-collector bases to draw out a Commander.
operation-data-tap=Triggered by mining the remains of a defeated SIMULAC Commander while carrying a SIMULAC Data Tap. The filled tap holds the Commander's neural pattern and can be used to craft Personal Combat Roboport modules.
mech-armor-mk2=Initiates the Promethium Armor research program. Unlocks the Armor Forging Station, your mechanical companion on this journey. Completing planetary investigations of the five base planets is required before the armor can be forged.
armor-adventure-nauvis=Dig deeper into the mysteries of Nauvis... who knows what monsters lurk in the depths?
big-demolisher-hunt=Preliminary investigation suggests that the largest of the demolishers may contain an extremely dense energy matrix. Combined with durable Vulcanus elements, this could form the chassis for the armor.
armor-adventure-vulcanus=From processing the remains, you discover how to forge them into the chassis for your new armor.
armor-adventure-gleba=The way the pentapods control their motion so precisely — could we take advantage of their biology to improve our interface? Maybe a thorough dissection will give us more information.
armor-adventure-fulgora=Dig deeper into the mysteries of Fulgora... could you find a way to harness the power of the skies even further?
armor-adventure-aquilo=Dig deeper into the mysteries of Aquilo... could anyone have come to this cold world before us?
aquilo-scanning-complete=You've detected a strange EM emission from somewhere deeper in the planet. You could set up radar stations to try to pinpoint the source.
nauvis-defense-complete=Surveying the remains of the giant spitter could lead to a new tougher outer shell for the armor.
forge-promethium-armor=Combine all five planetary components together to forge the armor.
mech-armor-mk2-running-speed=Overcharges the Mk2 suit's leg actuators, doubling movement speed. Bonus is suppressed when the suit is not worn.
regenerative-armor=Integrates an energy shield directly into the Promethium Armor chassis. Only one Regenerative Plating module may be equipped at a time.
personal-beacon=Integrates a full beacon into the Promethium Armor, allowing the player to act as a mobile module distribution hub.
personal-robot-stash=Houses 5 construction bots in the Promethium Armor. They deploy automatically when construction or deconstruction work is detected nearby, then return when idle.
pocket-dimension-roboport=Extends the pocket dimension with a stable power grid link. Roboports can now be placed inside the pocket dimension, enabling logistics and construction automation.
pocket-dimension=Folds a private 64×64 tile surface into the Promethium Armor. Press Alt+B to enter or exit. The dimension persists between sessions — everything built inside stays.
magnetic-data-agitation=Applies controlled electromagnetic agitation to raw Moshine data cores, producing a highly energized intermediate compound. The interference patterns generated during agitation are unusual — they may resonate with something further down the signal processing chain.
personal-tesla-turret=Triggered by completing your first batch of Vortex Data Cards. Unlocks the Personal Tesla Turret module for the Promethium Armor.
personal-time-stopper=Integrates a time distortion device into the Promethium Armor. Activate with Alt+T to surge your movement and crafting speed while dramatically slowing all nearby enemies. Only one may be equipped at a time.
personal-fridge=Spoilage in your main inventory progresses at half speed while wearing the Promethium Armor.
time-fracking=Could the strange time zones on Panglia be used for anything else? There's only one way to find out: blow one of them up.
cryo-core-acquired=You've authenticated with the Fulgoran depot's vault terminal. Additional vault access cards may now be created to access more cryo cores.
dissection-analysis-complete=The Harvester's first processed batch provides sufficient biological samples for a complete dissection. A bio-neural interface can now be synthesized.
armor-adventure-rabbasca=The ancient vault system on Rabbasca holds more secrets than initially apparent. A specially-crafted excavation key may unlock something deeper.
conquer-the-vault=Triggered by claiming the vault's prize. The path to the Warp Pylon is now open.
personal-warp-pylon=Unlocks the Personal Warp Pylon as an equippable module for the Promethium Armor, also providing a 40% movement speed bonus.
packable-forge=Unlocks the ability to slot the Armor Forging Station into the Promethium Armor as a 2×2 module. While equipped, it doubles your crafting speed. Only one may be equipped at a time.
