[mod-setting-description]
armor-adventure-quality-gate=When enabled, custom equipment cannot be placed in an armor grid if its quality exceeds the armor's quality. When first enabled, any existing violations are removed from all player grids on load.
armor-adventure-exploration-mode=When enabled, quest details are hidden in the tech tree until their prerequisites are complete. Quests still appear as ??? placeholders so you know they exist. The Armor Forging Station tech always shows normally.
armor-adventure-buffed-resistances=When enabled, the Promethium Armor uses an expanded resistance profile covering additional damage types. When disabled, only the base vanilla resistances apply.
armor-adventure-custom-textures=When enabled, the Armor Forging Station and Harvester use this mod's custom sprites (~128 MB VRAM). When disabled, sprites are borrowed from Castra Prime and Apia if those mods are loaded, saving significant VRAM. Falls back to vanilla assembling machine graphics if companion mods are absent.

