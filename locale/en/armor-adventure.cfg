[tips-and-tricks-item-description]
armor-adventure-welcome=Welcome to Armor Adventure! In order to proceed, first get to promethium science and research the "Promethium Armor" technology.
armor-adventure-welcome-ready=Welcome to Armor Adventure! You're getting ready to craft your armor.

[technology-description]
core-hunt=Triggered by mining the remains of a defeated SIMULAC Commander. Unlocks SIMULAC Core refinement.
mech-armor-mk2=Initiates the Promethium Armor research program. Unlocks the Armor Forging Station. Completing planetary field research across all four worlds is required before the armor can be forged.
armor-adventure-nauvis=Initiates the Nauvis field survey. Place a Pheromone Emitter far from your base and defend it for the duration of its charge cycle. Completes with a purge pulse that drops the Nauvis Armor Piece.
armor-adventure-vulcanus=Establishes a research foundation from Vulcanus foundry operations. Unlocks the Promethium Armor Chassis recipe.
armor-adventure-gleba=Establishes a research foundation from Gleba field operations. Unlocks the Harvester and Mind Control Rocket.
armor-adventure-fulgora=Establishes a research foundation from Fulgora salvage operations. Unlocks the Massive Lightning Collector.
armor-adventure-aquilo=Establishes a research foundation from Aquilo expedition data. Unlocks the Aquilo Prom Suit Component.
aquilo-scanning-complete=The scanner array has pinpointed the source of the anomalous EM emissions deep within the planet. Triggered by investigating the signal source. Unlocks the Aquilo Elevator Shaft.
forge-promethium-armor=Synthesizes all planetary field research into the definitive Promethium Armor. Also unlocks Promethium Armor Electronics & Telemetry crafting.
mech-armor-mk2-running-speed=Overcharges the Mk2 suit's leg actuators, doubling movement speed. Bonus is suppressed when the suit is not worn.
regenerative-armor=Integrates an energy shield directly into the Promethium Armor chassis. Only one Regenerative Plating module may be equipped at a time.
personal-combat-roboport=A combat-hardened personal roboport module for the Mk2 suit. Deployed from Castra battlefield salvage.
personal-beacon=Integrates a full beacon into the Promethium Armor, allowing the player to act as a mobile module distribution hub.
personal-robot-stash=Houses 5 construction bots in the Promethium Armor. They deploy automatically when construction or deconstruction work is detected nearby, then return when idle.
pocket-dimension-roboport=Extends the pocket dimension with a stable power grid link. Roboports can now be placed inside the pocket dimension, enabling logistics and construction automation.
pocket-dimension=Folds a private 64×64 tile surface into the Promethium Armor. Press Alt+B to enter or exit. The dimension persists between sessions — everything built inside stays.
personal-tesla-turret=Miniaturizes a tesla turret into the Promethium Armor. Fires electric beams that slow and push back enemies. Requires the tesla-turret technology.
personal-time-stopper=Integrates a time distortion device into the Promethium Armor. Activate with Alt+T to surge your movement and crafting speed while dramatically slowing all nearby enemies. Only one may be equipped at a time.
personal-fridge=Spoilage in your main inventory progresses at half speed while wearing the Promethium Armor.
personal-warp-pylon=Integrates a warp pylon into the Promethium Armor.
packable-forge=Unlocks the ability to slot the Armor Forging Station into the Promethium Armor as a 2×2 module. While equipped, it doubles your crafting speed. The armor acts as a mobile node in the Rabbasca warp network, automatically constructing ghosts within range using the shared warp inventory. Only one may be equipped at a time.
